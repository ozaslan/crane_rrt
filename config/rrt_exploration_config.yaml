      x_min: -4.5
      x_max:  4.5
      y_min: -4.5
      y_max:  4.5
      max_velocity: 2.0
      max_swing_angle: 0.4363
      max_force: 0.5
      min_duration: 0.20
      max_duration: 0.50
      enable_force_smoothing: true
      force_direction_bias: 0.35
      w_pos: 0.85
      w_vel: 0.15
      goal_bias: 0.15
      min_search_step: 1
      max_search_step: 15
      use_equal_budget_random_subset: false
      force_history_nns_weight: 0.0
      use_sst_planner: false
      sst_delta_bn: 0.45
