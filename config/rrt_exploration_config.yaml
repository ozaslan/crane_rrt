      require_goal_swing_check: true
      integration_dt: 0.02
      cable_radius: 0.08
      check_rope_collision: true
      rope_collision_samples: 10
      max_iterations: 20000
      max_nodes: 6000
      batch_iterations: 20
      loop_playback: true
      draw_payload_tree: true
      random_seed: 1001

    ns: "gantry"
    frame_id: "map"
